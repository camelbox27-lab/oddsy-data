<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wondiyo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0f14">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --zemin:      #0d0f14;
    --yuzey:      #151922;
    --kenar:      #232936;
    --yazi:       #e9edf3;
    --soluk:      #8d97a8;
    --yesil:      #34d399;
    --yesil-koyu: #10794f;
    --mavi:       #38bdf8;
    --mavi-koyu:  #0b5e8a;
    --mor:        #a78bfa;
    --mor-koyu:   #5b21b6;
    --kirmizi:    #f87171;
    --sari:       #fbbf24;
    --konsol:     #0a0c10;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
    background: var(--zemin);
    color: var(--yazi);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    max-width: 540px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---- baslik ---- */
  .tepe { display: flex; align-items: center; gap: 12px; }
  .tepe .marka { width: 44px; height: 44px; border-radius: 12px; flex: 0 0 auto; display: block; }
  .tepe h1 { font-size: 23px; margin: 0; letter-spacing: -0.4px; font-weight: 700; }
  .tepe p  { font-size: 12.5px; margin: 2px 0 0; color: var(--soluk); }

  /* ---- butonlar ---- */
  .butonlar { display: grid; gap: 11px; }
  button {
    font: inherit; border: 0; border-radius: 15px; color: #fff; width: 100%;
    cursor: pointer; transition: transform .08s, filter .15s;
  }
  button:active:not(:disabled) { transform: scale(.985); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .ana {
    display: flex; align-items: center; gap: 13px;
    padding: 19px 18px; font-size: 17px; font-weight: 650; letter-spacing: .2px;
  }
  .ana img {
    width: 38px; height: 38px; border-radius: 9px; background: #fff;
    object-fit: contain; flex: 0 0 auto;
  }
  .ana span { flex: 1; text-align: left; }
  .btn-iddaa  { background: linear-gradient(145deg, var(--yesil), var(--yesil-koyu)); }
  .btn-bet365 { background: linear-gradient(145deg, var(--mavi),  var(--mavi-koyu)); }
  .btn-bulten {
    background: linear-gradient(145deg, var(--mor), var(--mor-koyu));
    justify-content: center;
  }
  .btn-bulten span { flex: 0 1 auto; text-align: center; }
  .ayirac { border: 0; border-top: 1px solid var(--kenar); margin: 5px 0 1px; }
  .btn-ikisi {
    background: transparent; border: 1px solid var(--kenar); color: var(--soluk);
    padding: 13px; font-size: 14.5px; font-weight: 500;
  }

  /* ---- konsol ---- */
  .konsol-kutu {
    background: var(--konsol);
    border: 1px solid var(--kenar);
    border-radius: 13px;
    overflow: hidden;
    display: flex; flex-direction: column;
    flex: 1; min-height: 210px;
  }
  .konsol-ust {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 13px;
    border-bottom: 1px solid var(--kenar);
    background: var(--yuzey);
  }
  .konsol-ust .nokta { width: 9px; height: 9px; border-radius: 50%; background: var(--soluk); }
  .calisiyor .nokta  { background: var(--sari); animation: nabiz 1.2s ease-in-out infinite; }
  .tamam .nokta      { background: var(--yesil); }
  .hata .nokta       { background: var(--kirmizi); }
  @keyframes nabiz { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  .konsol-ust b {
    font-size: 11px; text-transform: uppercase; letter-spacing: .9px;
    color: var(--soluk); font-weight: 600; flex: 1;
  }
  .konsol-ust button {
    width: auto; background: none; color: var(--soluk);
    font-size: 11.5px; padding: 2px 6px; border-radius: 6px;
  }
  #konsol {
    margin: 0; padding: 11px 13px;
    font: 12.5px/1.65 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color: var(--soluk);
    overflow-y: auto; overflow-x: auto;
    flex: 1; white-space: pre-wrap; word-break: break-word;
    -webkit-overflow-scrolling: touch;
  }
  #konsol .sat { display: block; }
  #konsol .zaman { color: #4b5566; }
  #konsol .cmd { color: var(--yazi); font-weight: 600; }
  #konsol .ok  { color: var(--yesil); }
  #konsol .err { color: var(--kirmizi); }
  #konsol .wrn { color: var(--sari); }

  /* ---- ayar ---- */
  .kart {
    background: var(--yuzey); border: 1px solid var(--kenar);
    border-radius: 13px; padding: 14px;
  }
  details summary {
    cursor: pointer; font-size: 13px; color: var(--soluk);
    list-style: none; padding: 2px 0;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "⚙  "; }
  .satir { display: flex; gap: 8px; margin-top: 11px; }
  input {
    font: inherit; font-size: 15px; width: 100%; padding: 11px 13px;
    background: var(--zemin); border: 1px solid var(--kenar);
    border-radius: 10px; color: var(--yazi); min-width: 0;
  }
  input:focus { outline: 2px solid var(--mavi); outline-offset: -1px; }
  .satir button {
    width: auto; padding: 11px 16px; font-size: 14px; font-weight: 600;
    background: var(--kenar); color: var(--yazi); border-radius: 10px;
  }
  .yardim { font-size: 12.5px; color: var(--soluk); margin: 10px 0 0; }
  .yardim a { color: var(--mavi); }
</style>
</head>
<body>

<div class="tepe">
  <img class="marka" src="logo.png" alt="" onerror="this.src='ikon.svg'">
  <div>
    <h1>Wondiyo</h1>
    <p>Butona bas, veri çekilip siteye yüklensin.</p>
  </div>
</div>

<div class="butonlar">
  <button class="ana btn-iddaa" data-is="iddaa">
    <img src="iddaa.png" alt="">
    <span>VERİLERİ ÇEK YÜKLE</span>
  </button>
  <button class="ana btn-bet365" data-is="bet365">
    <img src="bet365.png" alt="">
    <span>VERİLERİ ÇEK YÜKLE</span>
  </button>
  <button class="btn-ikisi" data-is="ikisi">İkisini birden çek</button>

  <hr class="ayirac">

  <button class="ana btn-bulten" data-is="menu">
    <span>BÜLTEN YÜKLE</span>
  </button>
</div>

<div class="konsol-kutu" id="kutu">
  <div class="konsol-ust">
    <span class="nokta"></span>
    <b id="baslik">hazır</b>
    <button id="temizle">temizle</button>
  </div>
  <div id="konsol"></div>
</div>

<div class="kart">
  <details id="ayar">
    <summary>GitHub erişim anahtarı</summary>
    <div class="satir">
      <input id="token" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
      <button id="kaydet">Kaydet</button>
    </div>
    <p class="yardim">
      Fine-grained token, <b>sadece oddsy-data</b> ve <b>Actions: Read&nbsp;and&nbsp;write</b>
      yeterli. Telefonda saklanır, hiçbir yere gönderilmez.<br>
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Token oluştur →</a>
    </p>
  </details>
</div>

<script>
const DEPO    = "camelbox27-lab/oddsy-data";
const AKIS    = "veri-guncelle.yml";
const DAL     = "main";
const API     = "https://api.github.com";
const ANAHTAR = "oddsy_token";

const butonlar = [...document.querySelectorAll("[data-is]")];
const konsolEl = document.getElementById("konsol");
const kutuEl   = document.getElementById("kutu");
const baslikEl = document.getElementById("baslik");
const tokenEl  = document.getElementById("token");
const ayarEl   = document.getElementById("ayar");

/* ---------- konsol ---------- */
function yaz(metin, tip = "") {
  const s = document.createElement("span");
  s.className = "sat";
  const z = document.createElement("span");
  z.className = "zaman";
  z.textContent = new Date().toLocaleTimeString("tr-TR", { hour12: false }) + "  ";
  const g = document.createElement("span");
  if (tip) g.className = tip;
  g.textContent = metin;
  s.append(z, g);
  konsolEl.append(s);
  konsolEl.scrollTop = konsolEl.scrollHeight;
}
function durum(metin, sinif = "") {
  baslikEl.textContent = metin;
  kutuEl.className = "konsol-kutu" + (sinif ? " " + sinif : "");
}
document.getElementById("temizle").onclick = () => {
  konsolEl.textContent = "";
  durum("hazır");
};

/* ---------- token ---------- */
const tokenOku = () => { try { return localStorage.getItem(ANAHTAR) || ""; } catch { return ""; } };
tokenEl.value = tokenOku();
if (!tokenEl.value) ayarEl.open = true;
document.getElementById("kaydet").onclick = () => {
  try { localStorage.setItem(ANAHTAR, tokenEl.value.trim()); } catch {}
  yaz("anahtar kaydedildi", "ok");
  ayarEl.open = false;
};

/* ---------- github ---------- */
async function istek(yol, secenek = {}) {
  const token = tokenOku();
  if (!token) throw new Error("Önce GitHub erişim anahtarını kaydet.");
  const y = await fetch(API + yol, {
    ...secenek,
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + token,
      "X-GitHub-Api-Version": "2022-11-28",
      ...(secenek.body ? { "Content-Type": "application/json" } : {}),
    },
  });
  if (y.status === 401) throw new Error("Anahtar geçersiz veya süresi dolmuş.");
  if (y.status === 403) throw new Error("Anahtarda Actions yazma izni yok.");
  if (y.status === 404) throw new Error("Akış bulunamadı (veri-guncelle.yml main dalında mı?).");
  if (!y.ok) throw new Error("GitHub " + y.status + ": " + (await y.text()).slice(0, 160));
  return y.status === 204 ? null : y.json();
}

const bekle = ms => new Promise(r => setTimeout(r, ms));

async function calismayiBul(baslangic) {
  for (let i = 0; i < 20; i++) {
    const d = await istek(`/repos/${DEPO}/actions/workflows/${AKIS}/runs?per_page=5`);
    const c = (d.workflow_runs || []).find(r => new Date(r.created_at).getTime() >= baslangic - 15000);
    if (c) return c;
    await bekle(3000);
  }
  return null;
}

/* Calismayi izler ve BITEN her adimi konsola dokar. */
async function izle(id) {
  const basilan = new Set();
  while (true) {
    let isler = { jobs: [] };
    try { isler = await istek(`/repos/${DEPO}/actions/runs/${id}/jobs`); } catch {}

    for (const is_ of isler.jobs || []) {
      if (is_.conclusion === "skipped") continue;
      for (const adim of is_.steps || []) {
        if (adim.status !== "completed") continue;
        const anahtar = is_.id + ":" + adim.number;
        if (basilan.has(anahtar)) continue;
        basilan.add(anahtar);
        if (adim.conclusion === "skipped") continue;
        if (/^(Set up job|Post |Complete job|Run actions\/)/.test(adim.name)) continue;
        const ok = adim.conclusion === "success";
        yaz((ok ? "  ✓ " : "  ✗ ") + adim.name, ok ? "ok" : "err");
      }
    }

    const r = await istek(`/repos/${DEPO}/actions/runs/${id}`);
    if (r.status === "completed") return r;
    await bekle(4000);
  }
}

async function tetikle(is_) {
  butonlar.forEach(b => b.disabled = true);
  const baslangic = Date.now();
  durum("çalışıyor", "calisiyor");
  yaz("> " + is_.toUpperCase(), "cmd");

  try {
    await istek(`/repos/${DEPO}/actions/workflows/${AKIS}/dispatches`, {
      method: "POST",
      body: JSON.stringify({ ref: DAL, inputs: { hangisi: is_ } }),
    });
    yaz("  tetiklendi, çalışma aranıyor...");

    const c = await calismayiBul(baslangic);
    if (!c) {
      yaz("  çalışma bulunamadı — GitHub Actions sekmesine bak", "wrn");
      durum("bilinmiyor", "hata");
      return;
    }
    yaz("  çalışma #" + c.run_number + " başladı");

    const son = await izle(c.id);
    if (son.conclusion === "success") {
      yaz("✓ TAMAMLANDI — veri siteye yüklendi", "ok");
      durum("tamamlandı", "tamam");
    } else {
      yaz("✗ BAŞARISIZ (" + son.conclusion + ")", "err");
      durum("başarısız", "hata");
    }
  } catch (e) {
    yaz("✗ " + e.message, "err");
    durum("hata", "hata");
    if (/anahtar/i.test(e.message)) ayarEl.open = true;
  } finally {
    butonlar.forEach(b => b.disabled = false);
  }
}

butonlar.forEach(b => b.onclick = () => tetikle(b.dataset.is));
yaz("hazır — bir butona bas");
</script>
</body>
</html>
