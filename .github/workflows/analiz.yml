name: Analiz
run-name: Analiz · ${{ inputs.is }}

on:
  workflow_dispatch:
    inputs:
      is:
        type: choice
        options: [yari-skorlari, bugun-ara, olay-kesif]
        default: yari-skorlari

permissions:
  contents: read

jobs:
  yari-skorlari:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Yari skorlari
        if: ${{ inputs.is == 'yari-skorlari' }}
        run: python otomasyon/yari_skorlari.py
      - name: Bugunun bultenlerinde ara (kaydetmez)
        if: ${{ inputs.is == 'bugun-ara' }}
        run: |
          pip install --quiet -r otomasyon/requirements.txt
          cd otomasyon
          python iddaa_cek.py && python excel_to_json_ci.py iddaa || echo "iddaa cekilemedi"
          python bet365_cek.py && python excel_to_json_ci.py bet365 "$(date +%Y-%m-%d)" || echo "bet365 cekilemedi"
          python bugun_ara.py
      - name: Mac olaylari kesfi
        if: ${{ inputs.is == 'olay-kesif' }}
        run: python otomasyon/olay_kesif.py 0tybz5q1 KpK8y0Db
