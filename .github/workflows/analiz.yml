name: Analiz
run-name: Analiz · bet365 yari skorlari

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yari-skorlari:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Yari skorlari
        run: python otomasyon/yari_skorlari.py
