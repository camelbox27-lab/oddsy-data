name: Veri guncelle

# Telefondaki butonlar bu akisi GitHub API uzerinden workflow_dispatch ile tetikler.
on:
  workflow_dispatch:
    inputs:
      hangisi:
        description: "Hangi veri cekilecek?"
        required: true
        default: ikisi
        type: choice
        options:
          - iddaa
          - bet365
          - ikisi
          - menu
          - istatistik
          - teshis
          - telegram

# Ayni anda iki calisma main'e push etmeye kalkmasin.
concurrency:
  group: veri-guncelle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # iddaa / bet365 — kendi sabitlenmis paket surumleriyle (pandas 3.x).
  veri:
    if: inputs.hangisi == 'iddaa' || inputs.hangisi == 'bet365' || inputs.hangisi == 'ikisi'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Runner UTC calisir; dosya adi ve "bugun" hesabi Turkiye saatine gore olmali.
      TZ: Europe/Istanbul

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # cikti her zaman main'e yazilir (siteyi main besliyor)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: otomasyon/requirements.txt

      - name: Paketler
        run: pip install -r otomasyon/requirements.txt

      - name: Tarihi belirle
        id: t
        run: echo "gun=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # --- iddaa: gunluk bulten -> iddaa/gunluk/gunlukmaclar.xlsx + .json
      # Mackolik, GitHub'in veri merkezi IP'lerinden gelen mac sayfalarini
      # 403 ile reddediyor (olculdu: duz requests, ana sayfa isinmasi ve
      # curl_cffi'nin uc tarayici parmak izi -- hepsi 403). Mac LISTESI veren
      # JSON API calismaya devam ettigi icin sorun gorunmuyor ama oranlar
      # cekilemiyor ve gunlukmaclar.json bosa dusuyor.
      #
      # SOFA_PROXY secret'i tanimliysa istekler veri merkezi disi bir IP'den
      # cikar. Bos ise davranis degismez (ve 403 devam eder).
      # bet365 adimina proxy BAGLANMADI: Flashscore'dan saglikli cekiyor,
      # bosuna proxy kotasi harcamasin.
      - name: iddaa cek
        id: iddaa
        if: inputs.hangisi == 'iddaa' || inputs.hangisi == 'ikisi'
        continue-on-error: true      # 'ikisi' secildiginde biri patlarsa diger devam etsin
        env:
          https_proxy: ${{ secrets.SOFA_PROXY }}
          http_proxy: ${{ secrets.SOFA_PROXY }}
          no_proxy: github.com,api.github.com,raw.githubusercontent.com,objects.githubusercontent.com,codeload.github.com
        working-directory: otomasyon
        run: |
          python iddaa_cek.py
          python excel_to_json_ci.py iddaa

      # --- bet365: baslamayan maclar -> bet365/GGAAYYYY.xlsx + .json
      - name: bet365 cek
        id: bet365
        if: inputs.hangisi == 'bet365' || inputs.hangisi == 'ikisi'
        continue-on-error: true      # 'ikisi' secildiginde biri patlarsa diger devam etsin
        working-directory: otomasyon
        run: |
          python bet365_cek.py
          python excel_to_json_ci.py bet365 "${{ steps.t.outputs.gun }}"

      - name: Commit ve push
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A bet365/ iddaa/

          if git diff --cached --quiet; then
            echo "Degisiklik yok, push gerekmiyor."
            exit 0
          fi

          git commit -m "veri: ${{ inputs.hangisi }} guncellendi ($(date +%d.%m.%Y\ %H:%M))"

          # Baska bir calisma araya girdiyse rebase edip tekrar dene.
          for deneme in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push OK"
              exit 0
            fi
            echo "Push basarisiz (deneme $deneme), rebase edilip tekrar denenecek..."
            git pull --rebase origin main || true
            sleep $((deneme * 3))
          done
          echo "Push 4 denemede de basarisiz."
          exit 1

      - name: Sonucu dogrula
        if: always()
        run: |
          iddaa="${{ steps.iddaa.outcome }}"
          bet365="${{ steps.bet365.outcome }}"
          # Calismasi istenen adimlardan en az biri basarili olmali
          if [ "$iddaa" = "success" ] || [ "$bet365" = "success" ]; then
            echo "En az bir cekme basarili."
            exit 0
          fi
          echo "Calistirilan tum cekme adimlari basarisiz (iddaa=$iddaa bet365=$bet365)."
          exit 1

      - name: Ozet
        if: always()
        run: |
          {
            echo "### Veri guncelleme — ${{ inputs.hangisi }}"
            echo ""
            echo "| Adim | Sonuc |"
            echo "|---|---|"
            echo "| iddaa | ${{ steps.iddaa.outcome || 'atlandi' }} |"
            echo "| bet365 | ${{ steps.bet365.outcome || 'atlandi' }} |"
            echo ""
            echo "Tarih: $(date +'%d.%m.%Y %H:%M') (Europe/Istanbul)"
          } >> "$GITHUB_STEP_SUMMARY"

  # menu / istatistik — bot pipeline'lari. Ayri is olarak calisir cunku bot
  # pandas 2.x istiyor, yukaridaki is ise pandas 3.x'e sabitli (bet365 JSON'unun
  # byte uyumu buna bagli). Ayni runner'da ikisi bir arada kurulamaz.
  bot:
    if: inputs.hangisi == 'menu' || inputs.hangisi == 'istatistik' || inputs.hangisi == 'teshis'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Istanbul

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: otomasyon/bot_requirements.txt

      - name: Paketler
        run: pip install -r otomasyon/bot_requirements.txt

      - name: oddsy-data baglantisi
        # Bot scriptleri veri reposunu kendi klasorlerinin altinda "oddsy-data"
        # adiyla arar (CI yolu). Depo zaten burasi oldugu icin koke sembolik bag
        # kurulur; .gitignore'da oldugu icin commit'e girmez.
        run: ln -sfn "$GITHUB_WORKSPACE" otomasyon/bot/oddsy-data

      # Gecici teshis: Sofascore 403'unun sebebini olcer (bkz. otomasyon/sofa_teshis.py)
      # SOFA_PROXY secret'i tanimliysa teshis de ayni proxy'den cikar, boylece
      # MENU'yu calistirmadan once proxy'nin ise yarayip yaramadigi olculebilir.
      # Proxy adresi secret'tan gelir; workflow girdisi OLARAK VERILMEZ cunku bu
      # depo public ve girdiler calisma sayfasinda herkese gorunur.
      - name: Sofascore teshis
        id: teshis
        if: inputs.hangisi == 'teshis'
        continue-on-error: true
        env:
          https_proxy: ${{ secrets.SOFA_PROXY }}
          http_proxy: ${{ secrets.SOFA_PROXY }}
          no_proxy: github.com,api.github.com,raw.githubusercontent.com,objects.githubusercontent.com,codeload.github.com
        run: |
          python otomasyon/sofa_teshis.py || true
          echo
          python otomasyon/iddaa_teshis.py

      # --- BULTEN YUKLE: gunun bulteni + tahminler
      #
      # SofaScore ve Mackolik'in mac sayfalari GitHub IP'sinden 403 donuyor.
      # Bu yuzden merged dosyasi once Flashscore'dan uretilir, sonra pipeline
      # MOBIL=1 ile calisir ve o kaynaklara bagli adimlari atlar.
      # main.py kendi push'unu yapar.
      - name: Bulten yukle
        id: menu
        if: inputs.hangisi == 'menu'
        continue-on-error: true
        env:
          MOBIL: "1"
        run: |
          python otomasyon/bulten_uret.py
          cd otomasyon/bot && python main.py

      # NOT: droppingOdds.json'u main.py icinden korur (filter_bot.py MOBIL
      # bayragi ile mevcut dosyayi okur, bos listeyle ezmez). Burada bir sey
      # yapmak ise yaramaz: main.py push'u kendisi yapiyor.
      # --- istatistik: kart & korner (sadece data/ icine kopyalar, push etmez)
      - name: Istatistik
        id: istatistik
        if: inputs.hangisi == 'istatistik'
        continue-on-error: true
        working-directory: otomasyon/bot
        run: python istatistik/main.py

      - name: Commit ve push
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "Degisiklik yok, push gerekmiyor."
            exit 0
          fi

          git commit -m "veri: ${{ inputs.hangisi }} guncellendi ($(date +%d.%m.%Y\ %H:%M))"

          for deneme in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push OK"
              exit 0
            fi
            echo "Push basarisiz (deneme $deneme), rebase edilip tekrar denenecek..."
            git pull --rebase origin main || true
            sleep $((deneme * 3))
          done
          echo "Push 4 denemede de basarisiz."
          exit 1

      - name: Sonucu dogrula
        if: always()
        run: |
          menu="${{ steps.menu.outcome }}"
          ist="${{ steps.istatistik.outcome }}"
          tes="${{ steps.teshis.outcome }}"
          if [ "$menu" = "success" ] || [ "$ist" = "success" ] || [ "$tes" = "success" ]; then
            echo "Pipeline basarili."
            exit 0
          fi
          echo "Pipeline basarisiz (menu=$menu istatistik=$ist)."
          exit 1

  # telegram — siteye yuklenmis Ilk Yari Gol listesini Wondiyo grubuna gonderir.
  # Veri uretmez, sadece data/halfTimeGoals.json'i okur; push yapmaz.
  # Sadece stdlib kullandigi icin pip kurulumu yok, saniyeler icinde biter.
  telegram:
    if: inputs.hangisi == 'telegram'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Istanbul

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ilk Yari Gol listesini Telegram'a gonder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 otomasyon/telegram_gonder.py
