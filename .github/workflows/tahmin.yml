name: Tahmin
run-name: "${{ github.event_name == 'schedule' && 'Tahmin · gunluk (oncesi + canli)' || format('Tahmin · {0}', inputs.hangisi) }}"

# Tahmin uygulamasindaki (tahmin/) butonlar bu akisi workflow_dispatch ile
# tetikler. Mesajlar Wondiyo kanalina degil, ayri tahmin grubuna gider
# (TELEGRAM_CHAT_ID_2).
on:
  # Her sabah 07:00 (TR = 04:00 UTC): once mac oncesi tercihler (dunun
  # sonucu + gunun listesi), ardindan canli tarama 00:00'a kadar calisir.
  # GitHub'in zamanlayicisi tam saatlerde yogun oldugu icin birkac dakika
  # gecikebilir.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      hangisi:
        description: "Hangisi?"
        required: true
        default: oncesi
        type: choice
        options:
          - oncesi
          - canli
      gun:
        description: "Tarama gunu GG.AA.YYYY (yalnizca tarama kendini yeniden tetiklediginde)"
        required: false
        default: ""
        type: string

permissions:
  contents: write    # bet365 verisi + canli-kayit dali
  actions: write     # canli tarama 6 saat dolunca kendini yeniden tetikler

jobs:
  oncesi:
    if: github.event_name == 'schedule' || inputs.hangisi == 'oncesi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: tahmin-oncesi
      cancel-in-progress: false
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketler
        run: pip install --quiet requests

      - name: bet365 verisini hazirla
        run: bash otomasyon/bet365_hazirla.sh

      - name: Mac oncesi tercihleri gonder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          GITHUB_TOKEN: ${{ github.token }}   # liste arsivi (canli-kayit dali)
        run: python otomasyon/tahmin_oncesi.py

  canli:
    # Gunluk calismada mac oncesi isi bitince baslar (bet365 verisi ve
    # liste arsivi hazir olsun); elle tetiklenince dogrudan baslar.
    needs: oncesi
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.hangisi == 'canli') }}
    runs-on: ubuntu-latest
    # GitHub'in ust siniri 6 saat; tarama 340 dk sonra kendini yeniden
    # tetikleyip cikar, kalan pay kayit yazmak icin.
    timeout-minutes: 355
    concurrency:
      group: tahmin-canli
      cancel-in-progress: false
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketler
        run: pip install --quiet requests

      # Yeniden tetiklenen (gece yarisini gecmis) taramada veri zaten hazir.
      - name: bet365 verisini hazirla
        if: ${{ !inputs.gun }}
        run: bash otomasyon/bet365_hazirla.sh

      - name: Canli tarama
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          GITHUB_TOKEN: ${{ github.token }}
          TARAMA_GUN: ${{ inputs.gun }}
        run: python otomasyon/canli_tarama.py
